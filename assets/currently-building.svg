<svg width="920" height="150" viewBox="0 0 920 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cbCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c17"/>
      <stop offset="100%" stop-color="#0a1222"/>
    </linearGradient>

    <linearGradient id="border01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="border02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="border03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="border04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="cbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CARD 1: Backend Engineering -->
  <g transform="translate(0, 0)">
    <rect width="218" height="150" rx="10" fill="url(#cbCardBg)" stroke="url(#border01)" stroke-width="1.2"/>
    <rect x="14" y="14" width="45" height="16" rx="3" fill="#03263b"/>
    <text x="21" y="26" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#00F7FF">MOD 01</text>
    <circle cx="196" cy="22" r="3.5" fill="#00ff9d" filter="url(#cbGlow)">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    
    <text x="14" y="58" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#f8fafc">Backend</text>
    <text x="14" y="74" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#00F7FF">Engineering</text>
    
    <text x="14" y="100" font-family="'Fira Code', monospace" font-size="8.5" fill="#94a3b8">High-throughput APIs,</text>
    <text x="14" y="114" font-family="'Fira Code', monospace" font-size="8.5" fill="#94a3b8">REST / WebSockets</text>
    <text x="14" y="134" font-family="'Fira Code', monospace" font-size="8" font-weight="600" fill="#38bdf8">&gt; ACTIVE SPRINT</text>
  </g>

  <!-- CARD 2: Cloud Infrastructure -->
  <g transform="translate(234, 0)">
    <rect width="218" height="150" rx="10" fill="url(#cbCardBg)" stroke="url(#border02)" stroke-width="1.2"/>
    <rect x="14" y="14" width="45" height="16" rx="3" fill="#082845"/>
    <text x="21" y="26" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#38bdf8">MOD 02</text>
    <circle cx="196" cy="22" r="3.5" fill="#00ff9d" filter="url(#cbGlow)">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    
    <text x="14" y="58" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#f8fafc">Cloud</text>
    <text x="14" y="74" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#38bdf8">Infrastructure</text>
    
    <text x="14" y="100" font-family="'Fira Code', monospace" font-size="8.5" fill="#94a3b8">AWS VPC, Multi-AZ,</text>
    <text x="14" y="114" font-family="'Fira Code', monospace" font-size="8.5" fill="#94a3b8">Terraform IaC blueprints</text>
    <text x="14" y="134" font-family="'Fira Code', monospace" font-size="8" font-weight="600" fill="#818cf8">&gt; PROVISIONING</text>
  </g>

  <!-- CARD 3: System Architecture -->
  <g transform="translate(468, 0)">
    <rect width="218" height="150" rx="10" fill="url(#cbCardBg)" stroke="url(#border03)" stroke-width="1.2"/>
    <rect x="14" y="14" width="45" height="16" rx="3" fill="#1b1b42"/>
    <text x="21" y="26" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#818cf8">MOD 03</text>
    <circle cx="196" cy="22" r="3.5" fill="#00ff9d" filter="url(#cbGlow)">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    
    <text x="14" y="58" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#f8fafc">System</text>
    <text x="14" y="74" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#818cf8">Architecture</text>
    
    <text x="14" y="100" font-family="'Fira Code', monospace" font-size="8.5" fill="#94a3b8">Distributed caching,</text>
    <text x="14" y="114" font-family="'Fira Code', monospace" font-size="8.5" fill="#94a3b8">DB partitioning &amp; Redis</text>
    <text x="14" y="134" font-family="'Fira Code', monospace" font-size="8" font-weight="600" fill="#a78bfa">&gt; BENCHMARKING</text>
  </g>

  <!-- CARD 4: Automation -->
  <g transform="translate(702, 0)">
    <rect width="218" height="150" rx="10" fill="url(#cbCardBg)" stroke="url(#border04)" stroke-width="1.2"/>
    <rect x="14" y="14" width="45" height="16" rx="3" fill="#2d1338"/>
    <text x="21" y="26" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#c084fc">MOD 04</text>
    <circle cx="196" cy="22" r="3.5" fill="#00ff9d" filter="url(#cbGlow)">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    
    <text x="14" y="58" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#f8fafc">DevOps &amp;</text>
    <text x="14" y="74" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#c084fc">Automation</text>
    
    <text x="14" y="100" font-family="'Fira Code', monospace" font-size="8.5" fill="#94a3b8">CI/CD workflows, Docker,</text>
    <text x="14" y="114" font-family="'Fira Code', monospace" font-size="8.5" fill="#94a3b8">Kubernetes deployments</text>
    <text x="14" y="134" font-family="'Fira Code', monospace" font-size="8" font-weight="600" fill="#f43f5e">&gt; DEPLOYED</text>
  </g>
</svg>