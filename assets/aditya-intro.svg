<svg width="920" height="230" viewBox="0 0 920 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="introBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="typingClip">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" values="0; 390; 390; 0; 0" keyTimes="0; 0.48; 0.85; 0.95; 1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="918" height="228" rx="14" fill="url(#introBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Subtle Cyber Grid -->
  <g stroke="#00F7FF" stroke-width="0.7" opacity="0.05">
    <line x1="0" y1="46" x2="920" y2="46"/>
    <line x1="0" y1="92" x2="920" y2="92"/>
    <line x1="0" y1="138" x2="920" y2="138"/>
    <line x1="0" y1="184" x2="920" y2="184"/>
    <line x1="160" y1="0" x2="160" y2="230"/>
    <line x1="320" y1="0" x2="320" y2="230"/>
    <line x1="480" y1="0" x2="480" y2="230"/>
    <line x1="640" y1="0" x2="640" y2="230"/>
    <line x1="800" y1="0" x2="800" y2="230"/>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#00F7FF" stroke-width="1.8" fill="none" opacity="0.7">
    <path d="M14,32 L14,14 L32,14"/>
    <path d="M906,14 L888,14"/>
    <path d="M906,14 L906,32"/>
    <path d="M14,198 L14,216 L32,216"/>
    <path d="M906,216 L888,216"/>
    <path d="M906,216 L906,198"/>
  </g>

  <!-- Status Indicator -->
  <g transform="translate(685, 26)">
    <circle cx="6" cy="6" r="4.5" fill="#00ff9d" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="10" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="10.5" letter-spacing="1.5" fill="#7dffc4">SYS // ONLINE</text>
  </g>

  <!-- Node Identifier -->
  <text x="36" y="36" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#38bdf8" opacity="0.85">ENGINEERING IDENTITY ⌁ PROD-NODE-01</text>

  <!-- Name -->
  <text x="36" y="98" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="44" font-weight="800" letter-spacing="2" fill="url(#nameGrad)" filter="url(#glow)">ADITYA PANDE</text>

  <!-- Roles -->
  <text x="38" y="138" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="16.5" font-weight="600" letter-spacing="2.8" fill="url(#subGrad)">BACKEND DEVELOPER  <tspan fill="#00F7FF" opacity="0.6">|</tspan>  DEVOPS ENGINEER</text>

  <!-- Typing Tagline Container -->
  <g transform="translate(38, 162)">
    <!-- Terminal Prompt Symbol -->
    <text x="0" y="24" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#00F7FF">&gt;</text>

    <!-- Animated Typing Text -->
    <g transform="translate(22, 0)">
      <g clip-path="url(#typingClip)">
        <text x="0" y="24" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="15" font-weight="500" letter-spacing="1.2" fill="#e2e8f0">Build. Deploy. Automate. Scale.</text>
      </g>

      <!-- Typing Cursor -->
      <rect x="0" y="9" width="8" height="17" fill="#00F7FF">
        <animate attributeName="x" values="0; 335; 335; 0; 0" keyTimes="0; 0.48; 0.85; 0.95; 1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1; 0; 1; 0; 1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Subtle Scanline -->
  <line x1="1" y1="0" x2="919" y2="0" stroke="#00F7FF" stroke-width="1.2" opacity="0">
    <animate attributeName="y1" values="2; 226; 2" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="2; 226; 2" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0; 0.22; 0" dur="8s" repeatCount="indefinite"/>
  </line>
</svg>