<svg width="960" height="220" viewBox="0 0 960 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <linearGradient id="headlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="btnBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="btnBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082b47"/>
      <stop offset="100%" stop-color="#191338"/>
    </linearGradient>

    <filter id="ctaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="958" height="218" rx="14" fill="url(#ctaBg)" stroke="url(#btnBorderGrad)" stroke-width="1.3"/>

  <!-- Perspective Grid Lines -->
  <g stroke="#00F7FF" stroke-width="0.7" opacity="0.05">
    <line x1="0" y1="44" x2="960" y2="44"/>
    <line x1="0" y1="88" x2="960" y2="88"/>
    <line x1="0" y1="132" x2="960" y2="132"/>
    <line x1="0" y1="176" x2="960" y2="176"/>
    <line x1="160" y1="0" x2="160" y2="220"/>
    <line x1="320" y1="0" x2="320" y2="220"/>
    <line x1="480" y1="0" x2="480" y2="220"/>
    <line x1="640" y1="0" x2="640" y2="220"/>
    <line x1="800" y1="0" x2="800" y2="220"/>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#00F7FF" stroke-width="1.6" fill="none" opacity="0.6">
    <path d="M14,30 L14,14 L30,14"/>
    <path d="M946,14 L930,14"/>
    <path d="M946,14 L946,30"/>
    <path d="M14,190 L14,206 L30,206"/>
    <path d="M946,206 L930,206"/>
    <path d="M946,206 L946,190"/>
  </g>

  <!-- Sub-header -->
  <text x="480" y="44" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#38bdf8" opacity="0.9">⌁ PRODUCTION SYSTEMS  •  CLOUD ARCHITECTURE  •  AUTOMATION ⌁</text>

  <!-- Headline -->
  <text x="480" y="92" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="33" font-weight="800" letter-spacing="2" fill="url(#headlineGrad)" filter="url(#ctaGlow)">LET'S BUILD SOMETHING GREAT.</text>

  <!-- Button Graphic Container -->
  <g transform="translate(320, 126)">
    <!-- Button Glow Base -->
    <rect x="0" y="0" width="320" height="56" rx="28" fill="url(#btnBgGrad)" stroke="url(#btnBorderGrad)" stroke-width="1.6" filter="url(#btnGlow)"/>

    <!-- Pulse beacon -->
    <circle cx="36" cy="28" r="4.5" fill="#00ff9d">
      <animate attributeName="opacity" values="1; 0.25; 1" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Button Text -->
    <text x="168" y="34" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="1.5" fill="#f8fafc">EXPLORE MY PORTFOLIO <tspan fill="#00F7FF">→</tspan></text>

    <!-- Scanline Sweep Animation inside Button -->
    <g clip-path="url(#btnClip)">
      <line x1="0" y1="0" x2="0" y2="56" stroke="#00F7FF" stroke-width="2" opacity="0">
        <animate attributeName="x1" values="0; 320; 0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="0; 320; 0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0.4; 0" dur="4s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
</svg>