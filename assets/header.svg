<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#8F6BFF"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- tech grid -->
  <g stroke="#1fd3ff" stroke-width="1" opacity="0.06">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
    <line x1="1100" y1="0" x2="1100" y2="300"/>
  </g>

  <!-- perspective floor -->
  <g stroke="#8F6BFF" opacity="0.10">
    <line x1="0" y1="300" x2="560" y2="150"/>
    <line x1="200" y1="300" x2="580" y2="150"/>
    <line x1="1200" y1="300" x2="640" y2="150"/>
    <line x1="1000" y1="300" x2="620" y2="150"/>
  </g>

  <!-- constellation nodes -->
  <g fill="#00F7FF" opacity="0.35">
    <polyline points="140,55 260,35 380,58 500,32 610,50" fill="none" stroke="#00F7FF" stroke-width="1" opacity="0.25"/>
    <circle cx="140" cy="55" r="3">
      <animate attributeName="cy" values="55;40;55" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="35" r="2.4">
      <animate attributeName="cy" values="35;48;35" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="58" r="3">
      <animate attributeName="cy" values="58;44;58" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="32" r="2.4" fill="#FF6EC7">
      <animate attributeName="cy" values="32;46;32" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="50" r="3" fill="#FF6EC7">
      <animate attributeName="cy" values="50;36;50" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- isometric cube -->
  <g opacity="0.85">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="4.5s" repeatCount="indefinite"/>
    <polygon points="1005,88 1075,124 1005,160 935,124" fill="#123049" stroke="#00F7FF" stroke-width="1.4" opacity="0.55"/>
    <polygon points="935,124 1005,160 1005,232 935,196" fill="#1a1440" stroke="#8F6BFF" stroke-width="1.4" opacity="0.55"/>
    <polygon points="1005,160 1075,124 1075,196 1005,232" fill="#3a1030" stroke="#FF3CAC" stroke-width="1.4" opacity="0.55"/>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#00F7FF" stroke-width="2" fill="none" opacity="0.55">
    <path d="M22,52 L22,22 L52,22"/>
    <path d="M1178,22 L1178,52"/>
    <path d="M1148,22 L1178,22"/>
    <path d="M22,248 L22,278 L52,278"/>
    <path d="M1178,278 L1178,248"/>
    <path d="M1148,278 L1178,278"/>
  </g>

  <!-- system status -->
  <circle cx="862" cy="40" r="4" fill="#00ff9d">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="874" y="44" font-family="'Fira Code', monospace" font-size="11" letter-spacing="1.5" fill="#7dffc4">SYSTEM ONLINE</text>

  <!-- scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="#00F7FF" opacity="0">
    <animate attributeName="y" values="10;290;10" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- title block -->
  <text x="80" y="150" font-family="'Fira Code', monospace" font-size="62" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)">ADITYA PANDE</text>
  <text x="83" y="184" font-family="'Fira Code', monospace" font-size="21" letter-spacing="3" fill="#8fe8ff" filter="url(#softGlow)">FULL STACK DEVELOPER</text>
  <text x="83" y="212" font-family="'Fira Code', monospace" font-size="15" letter-spacing="2" fill="#c9a6ff">CLOUD &#8226; DEVOPS &#8226; SYSTEM ARCHITECTURE</text>

  <text x="83" y="248" font-family="'Fira Code', monospace" font-size="14" fill="#66f7ff" opacity="0.85">&gt; Engineering systems that scale, ship, and stay online.</text>
  <rect x="568" y="236" width="9" height="16" fill="#66f7ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
