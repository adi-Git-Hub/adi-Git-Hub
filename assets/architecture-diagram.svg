<svg width="960" height="560" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#090f1e"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2338"/>
      <stop offset="100%" stop-color="#0a1726"/>
    </linearGradient>

    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102540"/>
      <stop offset="100%" stop-color="#0c1a2d"/>
    </linearGradient>

    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1842"/>
      <stop offset="100%" stop-color="#120e28"/>
    </linearGradient>

    <linearGradient id="authGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2924"/>
      <stop offset="100%" stop-color="#071b17"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13233b"/>
      <stop offset="100%" stop-color="#0b1626"/>
    </linearGradient>

    <linearGradient id="cacheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d151c"/>
      <stop offset="100%" stop-color="#1c0c11"/>
    </linearGradient>

    <linearGradient id="pipelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="archGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrowCyan" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#00F7FF"/>
    </marker>
    <marker id="arrowBlue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Frame Background -->
  <rect x="1" y="1" width="958" height="558" rx="14" fill="url(#archBg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#00F7FF" stroke-width="0.6" opacity="0.04">
    <line x1="0" y1="56" x2="960" y2="56"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="200" x2="960" y2="200"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="440" x2="960" y2="440"/>
    <line x1="120" y1="0" x2="120" y2="560"/>
    <line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
    <line x1="840" y1="0" x2="840" y2="560"/>
  </g>

  <!-- Header Bar -->
  <g transform="translate(30, 24)">
    <text x="0" y="14" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#00F7FF">SYSTEM TOPOLOGY &amp; CLOUD ARCHITECTURE</text>
    <text x="0" y="28" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1.2" fill="#64748b">END-TO-END FLOW: INGRESS ⌁ GATEWAY ⌁ SERVICES ⌁ PERSISTENCE ⌁ INFRASTRUCTURE</text>

    <!-- Status badge -->
    <rect x="740" y="0" width="160" height="22" rx="4" fill="#0c1929" stroke="#00F7FF" stroke-width="0.8" opacity="0.8"/>
    <circle cx="754" cy="11" r="3.5" fill="#00ff9d">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="765" y="15" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" letter-spacing="1" fill="#7dffc4">HIGH AVAILABILITY</text>
  </g>

  <!-- AWS CLOUD & KUBERNETES CONTAINER BOUNDARY -->
  <rect x="220" y="70" width="710" height="340" rx="12" fill="#08101e" fill-opacity="0.4" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.65"/>
  <text x="236" y="92" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#38bdf8">☁ AWS VPC CLOUD ENVIRONMENT  ⌁  DOCKER &amp; KUBERNETES (EKS)</text>

  <!-- ================= TIER 1: CLIENT ================= -->
  <g transform="translate(30, 150)">
    <rect width="150" height="130" rx="10" fill="url(#clientGrad)" stroke="#00F7FF" stroke-width="1.2"/>
    <rect x="12" y="12" width="22" height="18" rx="3" fill="none" stroke="#00F7FF" stroke-width="1.2"/>
    <line x1="16" y1="34" x2="30" y2="34" stroke="#00F7FF" stroke-width="1.5"/>
    <text x="42" y="26" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F7FF">CLIENT TIER</text>
    <text x="14" y="56" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#f1f5f9">Web / SPA (React)</text>
    <text x="14" y="72" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#f1f5f9">Mobile Clients</text>
    <text x="14" y="88" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#f1f5f9">API Consumers</text>
    <rect x="14" y="102" width="75" height="16" rx="3" fill="#082f49"/>
    <text x="20" y="113" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">HTTPS / WSS</text>
  </g>

  <!-- Connect Line: Client -> Gateway -->
  <line x1="180" y1="215" x2="250" y2="215" stroke="#00F7FF" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>
  <!-- Animated packet dot -->
  <circle cx="180" cy="215" r="3" fill="#00F7FF" filter="url(#archGlow)">
    <animate attributeName="cx" values="180; 250; 180" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= TIER 2: API GATEWAY ================= -->
  <g transform="translate(255, 135)">
    <rect width="180" height="160" rx="10" fill="url(#gatewayGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="14" y="24" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">API GATEWAY</text>
    <text x="14" y="40" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Reverse Proxy / Ingress</text>

    <line x1="14" y1="48" x2="166" y2="48" stroke="#38bdf8" stroke-width="0.6" opacity="0.4"/>

    <text x="14" y="68" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Nginx / Ingress Ctrl</text>
    <text x="14" y="86" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ SSL/TLS Termination</text>
    <text x="14" y="104" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Rate Limiting</text>
    <text x="14" y="122" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Load Balancing</text>
    <rect x="14" y="134" width="80" height="16" rx="3" fill="#0b2847"/>
    <text x="20" y="145" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">PORT :443 / :80</text>
  </g>

  <!-- Connect Lines: Gateway -> Backend & Auth -->
  <path d="M435,185 L485,155" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M435,245 L485,275" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- ================= TIER 3: BACKEND & AUTH ================= -->
  <!-- 3A: Backend Services -->
  <g transform="translate(490, 105)">
    <rect width="200" height="110" rx="10" fill="url(#backendGrad)" stroke="#818cf8" stroke-width="1.2"/>
    <text x="14" y="24" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a78bfa">BACKEND SERVICES</text>
    <text x="14" y="44" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Node.js / Express Core</text>
    <text x="14" y="62" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ REST APIs &amp; WebSockets</text>
    <text x="14" y="80" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Business Logic / Worker</text>
    <rect x="14" y="88" width="90" height="15" rx="3" fill="#20174d"/>
    <text x="18" y="99" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="8" fill="#c084fc">DOCKERIZED POD</text>
  </g>

  <!-- 3B: Authentication & Identity -->
  <g transform="translate(490, 230)">
    <rect width="200" height="95" rx="10" fill="url(#authGrad)" stroke="#34d399" stroke-width="1.2"/>
    <text x="14" y="22" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">AUTHENTICATION</text>
    <text x="14" y="42" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ JWT Token Verification</text>
    <text x="14" y="58" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Server-Side RBAC</text>
    <text x="14" y="74" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Bcrypt / Secrets Mgmt</text>
  </g>

  <!-- Connect Line between Backend and Auth -->
  <line x1="590" y1="215" x2="590" y2="230" stroke="#34d399" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Connect Lines: Backend -> DB & Cache -->
  <path d="M690,145 L740,145" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowPurple)"/>
  <path d="M690,175 L740,245" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- ================= TIER 4: DATABASE & CACHE ================= -->
  <!-- 4A: Primary Database -->
  <g transform="translate(745, 105)">
    <rect width="165" height="95" rx="10" fill="url(#dbGrad)" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="14" y="22" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60a5fa">PRIMARY DATABASE</text>
    <text x="14" y="42" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ PostgreSQL / MongoDB</text>
    <text x="14" y="58" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Numbered Migrations</text>
    <text x="14" y="74" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Persistent Storage</text>
  </g>

  <!-- 4B: Redis Cache -->
  <g transform="translate(745, 220)">
    <rect width="165" height="90" rx="10" fill="url(#cacheGrad)" stroke="#f87171" stroke-width="1.2"/>
    <text x="14" y="22" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f87171">IN-MEMORY CACHE</text>
    <text x="14" y="42" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Redis Cluster</text>
    <text x="14" y="58" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Session / Pub-Sub</text>
    <text x="14" y="74" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">▪ Fast Low-Latency Read</text>
  </g>

  <!-- Kubernetes Cluster Status Footer inside Cloud Box -->
  <g transform="translate(255, 345)">
    <rect width="655" height="50" rx="8" fill="#071322" stroke="#0ea5e9" stroke-width="0.8"/>
    <text x="16" y="22" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">KUBERNETES ORCHESTRATION CLUSTER (EKS)</text>
    <text x="16" y="38" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">Multi-Zone Pods  ⌁  Service Discovery  ⌁  Horizontal Pod Autoscaling (HPA)  ⌁  Self-Healing Health Checks</text>
    <circle cx="620" cy="25" r="4" fill="#00ff9d">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="630" y="28" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="8.5" fill="#7dffc4">HEALTHY</text>
  </g>

  <!-- ================= TIER 5: DEVOPS & CI/CD PIPELINE ================= -->
  <g transform="translate(30, 435)">
    <rect width="900" height="100" rx="10" fill="#090d19" stroke="url(#pipelineGrad)" stroke-width="1.2"/>

    <!-- Pipeline title -->
    <text x="18" y="24" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#00F7FF">AUTOMATED CI/CD &amp; DEVOPS DELIVERY PIPELINE</text>

    <!-- Stage 1 -->
    <g transform="translate(20, 36)">
      <rect width="130" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="20" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38bdf8">01. CODE &amp; GIT</text>
      <text x="10" y="36" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Branch &amp; PR Review</text>
    </g>

    <text x="156" y="65" font-family="'Fira Code', monospace" font-size="12" fill="#00F7FF">→</text>

    <!-- Stage 2 -->
    <g transform="translate(172, 36)">
      <rect width="130" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="20" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38bdf8">02. AUTOMATED CI</text>
      <text x="10" y="36" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">GitHub Actions / Tests</text>
    </g>

    <text x="308" y="65" font-family="'Fira Code', monospace" font-size="12" fill="#38bdf8">→</text>

    <!-- Stage 3 -->
    <g transform="translate(324, 36)">
      <rect width="130" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="20" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#818cf8">03. CONTAINER</text>
      <text x="10" y="36" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Docker Multi-Stage</text>
    </g>

    <text x="460" y="65" font-family="'Fira Code', monospace" font-size="12" fill="#818cf8">→</text>

    <!-- Stage 4 -->
    <g transform="translate(476, 36)">
      <rect width="130" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="20" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#c084fc">04. TERRAFORM IaC</text>
      <text x="10" y="36" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">AWS Infra Provision</text>
    </g>

    <text x="612" y="65" font-family="'Fira Code', monospace" font-size="12" fill="#c084fc">→</text>

    <!-- Stage 5 -->
    <g transform="translate(628, 36)">
      <rect width="130" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="20" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#f43f5e">05. DEPLOY K8S</text>
      <text x="10" y="36" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Helm Zero-Downtime</text>
    </g>

    <text x="764" y="65" font-family="'Fira Code', monospace" font-size="12" fill="#f43f5e">→</text>

    <!-- Stage 6 -->
    <g transform="translate(780, 36)">
      <rect width="105" height="50" rx="6" fill="#062e24" stroke="#059669"/>
      <text x="10" y="20" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399">06. OBSERVE</text>
      <text x="10" y="36" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="8" fill="#6ee7b7">Logs &amp; Alerts</text>
    </g>
  </g>
</svg>