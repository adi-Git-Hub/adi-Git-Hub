<svg width="1200" height="160" viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#8F6BFF"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="160" fill="url(#bgGrad2)"/>

  <g stroke="#1fd3ff" stroke-width="1" opacity="0.05">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="300" y1="0" x2="300" y2="160"/>
    <line x1="600" y1="0" x2="600" y2="160"/>
    <line x1="900" y1="0" x2="900" y2="160"/>
  </g>

  <line x1="260" y1="55" x2="940" y2="55" stroke="url(#ctaGrad)" opacity="0.5" stroke-width="1.5"/>

  <text x="600" y="92" text-anchor="middle" font-family="'Fira Code', monospace" font-size="30" font-weight="700" fill="url(#ctaGrad)" filter="url(#glow2)">LET'S BUILD SYSTEMS THAT SCALE.</text>

  <line x1="260" y1="108" x2="940" y2="108" stroke="url(#ctaGrad)" opacity="0.5" stroke-width="1.5"/>

  <rect x="0" y="0" width="1200" height="2" fill="#00F7FF" opacity="0">
    <animate attributeName="y" values="0;158;0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
